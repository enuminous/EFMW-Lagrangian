name: Verify real and scalar continuum bridge

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  continuum:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Prepare fresh evidence
        run: |
          mkdir -p continuum/verification
          echo "ELAN_HOME=$RUNNER_TEMP/efmw-elan" >> "$GITHUB_ENV"
          git rev-parse HEAD > continuum/verification/commit.txt
      - name: Install standard pinned Lean
        run: |
          # Pin and checksum the installer; Lean itself is pinned by lean-toolchain.
          installer_dir="$RUNNER_TEMP/efmw-elan-installer"
          mkdir -p "$installer_dir"
          curl --fail --show-error --location --retry 3 \
            https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz \
            --output "$installer_dir/elan.tar.gz"
          (cd "$installer_dir" && \
            echo '42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  elan.tar.gz' | sha256sum --check)
          tar -xzf "$installer_dir/elan.tar.gz" -C "$installer_dir"
          "$installer_dir/elan-init" -y --default-toolchain none --no-modify-path
          export PATH="$ELAN_HOME/bin:$PATH"
          echo "$ELAN_HOME/bin" >> "$GITHUB_PATH"
          toolchain="$(cat lean-toolchain)"
          test "$toolchain" = 'leanprover/lean4:v4.28.0'
          elan toolchain install "$toolchain"
          {
            python3 --version
            elan --version
            elan show
            elan which lake
            elan which lean
            lake env lean --version
          } | tee continuum/verification/toolchain.log
      - name: Check unchanged C1 and regenerate bridge instances
        run: |
          python3 scripts/freeze.py
          python3 scripts/audit.py > continuum/verification/source-audit.log
          python3 continuum/generate.py
          git diff --exit-code -- candidate sources src audit EFMWLagrangian EFMWLagrangian.lean continuum/EFMWContinuum continuum/EFMWContinuum.lean continuum/certificate_index.json
      - name: Restore pinned upstream dependencies
        id: dependencies
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: continuum/.lake/packages
          key: continuum-upstream-ubuntu24-v1-${{ hashFiles('continuum/lake-manifest.json', 'continuum/lean-toolchain') }}
      - name: Fetch pinned dependencies and upstream compiled library cache
        if: steps.dependencies.outputs.cache-hit != 'true'
        working-directory: continuum
        run: |
          lake exe cache get Mathlib.Analysis.Calculus.Deriv.Mul Mathlib.Analysis.Calculus.Deriv.Add Mathlib.Analysis.Calculus.Deriv.Comp Mathlib.Analysis.Calculus.LineDeriv.IntegrationByParts Mathlib.Analysis.Calculus.ParametricIntegral Mathlib.Analysis.Distribution.AEEqOfIntegralContDiff Mathlib.Tactic.Ring Mathlib.Tactic.Linarith Mathlib.Tactic.Convert 2>&1 | tee verification/dependencies.log
          git diff --exit-code -- lake-manifest.json lean-toolchain
      - name: Save pinned upstream dependencies
        if: steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: continuum/.lake/packages
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - name: Build all bridge theorems
        working-directory: continuum
        run: lake build 2>&1 | tee verification/build.log
      - name: Audit transitive axioms and certificate coverage
        working-directory: continuum
        run: lake env lean Audit.lean 2>&1 | tee verification/axioms.log
      - name: Recheck compiled bridge proofs
        working-directory: continuum
        run: lake env leanchecker -v EFMWContinuum 2>&1 | tee verification/leanchecker.log
      - name: Reject invalid derivative and forbidden-axiom probes
        working-directory: continuum
        run: python3 negative_checks.py 2>&1 | tee verification/negative_checks.log
      - name: Preserve verification logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: continuum-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 90
          path: continuum/verification/
