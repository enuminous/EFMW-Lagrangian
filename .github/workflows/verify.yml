name: Verify candidate and Lean certificates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Frozen C1 / Lean 4.28.0
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Prepare fresh verification evidence
        run: |
          # The committed files are historical authoring evidence, not this run.
          rm -f verification/*.log verification/build_status.json
          mkdir -p verification
          echo "ELAN_HOME=$RUNNER_TEMP/efmw-elan" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import json
          import os
          import platform
          import subprocess
          from pathlib import Path

          record = {
              "commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "run_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "toolchain": Path("lean-toolchain").read_text().strip(),
              "runner": platform.platform(),
              "launcher": "Standard upstream elan / lake / lean; no explicit-path launcher",
          }
          Path("verification/ci_environment.json").write_text(json.dumps(record, indent=2) + "\n")
          PY

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install pinned elan and the repository's Lean toolchain
        run: |
          # Pin and checksum the installer; Lean itself is pinned by lean-toolchain.
          installer_dir="$RUNNER_TEMP/efmw-elan-installer"
          mkdir -p "$installer_dir"
          curl --fail --show-error --location --retry 3 \
            https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz \
            --output "$installer_dir/elan.tar.gz"
          (cd "$installer_dir" && \
            echo '42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  elan.tar.gz' | sha256sum --check)
          tar -xzf "$installer_dir/elan.tar.gz" -C "$installer_dir"
          "$installer_dir/elan-init" -y --default-toolchain none --no-modify-path
          export PATH="$ELAN_HOME/bin:$PATH"
          echo "$ELAN_HOME/bin" >> "$GITHUB_PATH"
          toolchain="$(cat lean-toolchain)"
          test "$toolchain" = 'leanprover/lean4:v4.28.0'
          elan toolchain install "$toolchain"
          {
            python3 --version
            elan --version
            elan show
            elan which lake
            elan which lean
            lake env lean --version
          } | tee verification/toolchain.log

      - name: Run the complete verification pipeline from a clean build
        run: |
          # Do not inherit any optional authoring-environment launcher overrides.
          env -u EFMW_LAKE -u EFMW_LEAN_LIBRARY_ROOT -u EFMW_EXPLICIT_TOOLCHAIN \
            -u LEAN_SYSROOT -u LAKE_HOME -u LEAN_PATH -u LEAN_SRC_PATH -u ELAN_TOOLCHAIN \
            python3 scripts/verify.py --clean \
              --launcher-note "Standard upstream Lean 4.28.0 via elan 4.2.4 on GitHub-hosted Ubuntu 24.04" \
            2>&1 | tee verification/pipeline.log

      - name: Check deterministic regeneration and unchanged frozen inputs
        run: |
          git diff --exit-code -- candidate sources src audit \
            Audit.lean EFMWLagrangian.lean EFMWLagrangian \
            lean-toolchain lakefile.toml lake-manifest.json \
            2>&1 | tee verification/regeneration.log

      - name: Summarize verification and its scope
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("verification/build_status.json")
          lines = ["## Frozen C1 verification", "", f"Commit: `{os.environ['GITHUB_SHA']}`", ""]
          if path.exists():
              status = json.loads(path.read_text())
              lines += [f"Pipeline: **{status['overall']}**", "", "| Stage | Result |", "|---|---|"]
              lines += [f"| {s['name']} | {s['status']} (exit {s['exit_code']}) |" for s in status['stages']]
              lines += ["", status['launcher'], ""]
          else:
              lines += ["No fresh verifier result: inspect the setup steps for failure.", ""]
          lines += [
              "The workflow also requires byte-identical regeneration of the tracked audit and Lean inputs.",
              "Finite integer-polynomial certificates only. Continuum variation, PDE existence,",
              "source-to-formal meaning, and physical validity remain outside this verification.",
              "The 585 statements are classified audit rows, not 585 proved physical equations.",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("\n".join(lines) + "\n")
          PY

      - name: Preserve this run's verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: error
          path: |
            verification/build_status.json
            verification/ci_environment.json
            verification/*.log
            audit/source_manifest.json
            audit/summary.json
